# cargo-dist workspace configuration
# https://opensource.axo.dev/cargo-dist/
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# dist version this config was generated for
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build targets: macOS (arm + x86) + Linux (arm + x86). Windows deferred per plan Scope Boundaries.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# The installers to generate for each app
installers = ["shell"]
# Unix archive format must be .tar.gz — self_update is built with archive-tar + compression-flate2 (gzip).
# cargo-dist 0.32 defaults to .tar.xz on unix; override to .tar.gz so self_update extraction succeeds.
unix-archive = ".tar.gz"
# We own the self-update path (self_update crate); do not install cargo-dist's axoupdater.
install-updater = false
# Gate releases on the test suite: run .github/workflows/ci.yml as the
# `custom-ci` job, alongside the artifact builds. This must be a
# LOCAL-ARTIFACTS job, never a plan job. cargo-dist puts a local-artifacts job
# in the host job's `needs` AND checks its result in host's `if`, so red tests
# mean host is skipped and nothing is published.
#
# A plan job sits upstream of build-local-artifacts and appears in neither of
# host's lists. When it fails, the builds are SKIPPED, and host's `if` reads
# "skipped" as fine ("skipped is fine" in the cargo-dist 0.32/0.33 template).
# So host publishes a release with no assets. That is exactly what happened to
# v0.11.1 and ss-magic-plugin-v1.0.0 (2026-09-30): the test gate failed, both
# releases went out holding only dist-manifest.json, and release immutability
# plus the tag ruleset made both versions unrecoverable.
# `scripts/build-plugin-zip.py --check` ("release gate blocks publishing")
# asserts the generated release.yml keeps this shape.
local-artifacts-jobs = ["./ci"]
# After a release is announced, give the repository-wide "latest" mark back to
# the newest CLI release if a plugin release just took it (R12). `gh release
# create` marks whatever it published as latest, and every `ss-magic` binary
# released before the per-line update check polls `releases/latest` and parses
# only a bare `vX.Y.Z` – a plugin release left holding the mark makes those
# installs report "already up to date" until the next CLI release. The job is
# .github/workflows/mark-latest.yml, driving scripts/mark-latest.sh; a `v*` tag
# exits 0 at once, so the CLI's own releases never touch the mark.
post-announce-jobs = ["./mark-latest"]
# Attest the per-target release archives (Sigstore/SLSA provenance via
# actions/attest). Default phase (build-local-artifacts) is deliberate:
# it signs same-job build output before it transits Actions artifact
# storage; the installer script and checksum files are NOT attested at
# this phase. Changing the phase is a security decision — see
# docs/plans/2026-07-14-002-feat-release-artifact-attestations-plan.md.
github-attestations = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"

# TWO release lines out of one workspace.
#
#   `ss-magic`        – the sync CLI – releases on a bare `vX.Y.Z` tag.
#   `ss-magic-plugin` – the Claude Code plugin – releases on `ss-magic-plugin-vX.Y.Z`.
#
# cargo-dist parses a tag as `[PACKAGE_NAME-]VERSION`, so the prefixed shape
# names the plugin explicitly while the bare shape names "every dist-able package
# sitting at that version". A bare tag therefore selects the CLI ALONE only
# because the two crate versions always differ – there is no way to say "this tag
# means the CLI only". `scripts/build-plugin-zip.py --check` refuses a tree where
# the two versions match, which is what keeps that invariant true.
#
# The CLI's bare shape is not negotiable: the updater's anchored filter and every
# already-installed binary look for `vX.Y.Z`, so a prefixed `ss-magic-vX.Y.Z` tag
# would publish a release the whole installed base ignores.
#
# The plugin zip is declared as an extra artifact on the PLUGIN crate
# (`[[package.metadata.dist.extra-artifacts]]` in crates/ss-magic-plugin/Cargo.toml)
# rather than here, so it rides the plugin's tag and not the CLI's. Do not
# duplicate it at workspace level: a workspace-level entry would attach the zip to
# every release, including the CLI's.
#
# `installers = ["shell"]` above stays a workspace-level default and is overridden
# to `[]` on the plugin package – the plugin is delivered by the marketplace, so a
# second, unpinned install path for it would be a delivery surface nothing
# verifies.
