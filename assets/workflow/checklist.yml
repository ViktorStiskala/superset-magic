# Render the ss-magic operator checklists a pull request adds or changes into a
# pull-request comment, and fail the pull request when one of them is not valid.
#
# Written by `ss-magic-plugin setup-github-ci`, which substitutes the pinned
# version below. Do not hand-edit: `setup-github-ci` compares this file against
# the version it would write, and a local edit makes every later run report the
# file as "differing" instead of quietly advancing the pin.
#
# ── Why there are two jobs ───────────────────────────────────────────────────
#
# A single job that both checks out pull-request code and holds a write token is
# the classic Actions privilege-escalation shape: the checked-out code is
# authored by whoever opened the pull request, anything that runs it (a build
# script, a test, a formatter) runs as the workflow, and the token it can reach
# is one that writes to this repository. The split below removes the overlap
# rather than relying on nobody adding such a step later:
#
#   render   checks out the pull request, holds `contents: read` and nothing
#            else, and hands its output on as an artifact.
#   comment  holds `pull-requests: write`, checks out no code at all, and only
#            downloads that artifact and posts it, as a comment it creates once
#            and rewrites on every later push.
#
# For the same reason the trigger is `pull_request` and never
# `pull_request_target`: `pull_request_target` runs in the context of the base
# branch with a write-capable token and a fork's code, which is the exact
# combination the split exists to prevent.
#
# The cost of that choice is stated rather than worked around: on a pull request
# opened from a fork, GitHub issues a read-only token no matter what this file
# asks for, so the comment cannot be posted. The comment job is therefore
# skipped for fork pull requests instead of failing the run on every one of
# them; the render job still runs, so an invalid checklist is still caught.
#
# ── Which checklists are rendered ────────────────────────────────────────────
#
# Exactly the top-level docs/actions/*.checklist.json files this pull request
# adds or modifies, compared with the tip of the branch it targets. A checklist
# merged by an earlier pull request is not this one's business, and with no
# pointer file in CI there is nothing else that could say which document is
# meant once docs/actions/ holds more than one.
#
# The checkout is GitHub's merge commit for the pull request, so its first
# parent is that branch tip: diffing the two leaves out whatever arrived by
# merging the target branch in. A deleted checklist is not selected, a renamed
# one is selected at its new path, one that changed between a file and a
# symlink counts as modified, and a file in a subdirectory of
# docs/actions/ never is. None means a green job and no comment; several mean
# one comment holding each document in turn.
#
# The selection fails closed. A checkout that is not a merge commit, or a
# `git diff` that fails, fails the job: read as "no checklists", either would
# silently switch the verify gate off for every pull request.
#
# ── Why no checklist text reaches a shell ────────────────────────────────────
#
# A checklist is repository content: its prose is written by whoever opened the
# pull request. Rendered Markdown therefore travels as a file from the moment it
# is produced to the moment `gh` reads it from that file (`--body-file` for a
# new comment, `-F body=@<file>` for an update), and is never interpolated into
# a command line, an `echo`, or a `${{ }}` expression inside a `run:` block. The
# selected file names travel the same way: NUL-separated in a file, read back
# into an array, and passed to the binary as separate arguments.
#
# The comments already on the pull request are text anybody who can comment
# wrote, so they are handled the same way: the listing goes to a file, `jq`
# reads that file as data with the marker passed as `--arg`, and the only thing
# that comes back to the shell is a comment id, checked to be all digits before
# it is used.
#
# ── Which comment is rewritten ───────────────────────────────────────────────
#
# Only this workflow's own. The body starts with a hidden HTML marker line, and
# the comment job looks for the newest comment that both was written by
# `github-actions[bot]` and starts with that marker; it edits that comment by
# id and creates a new one only when there is none. `gh pr comment --edit-last`
# is not used, because "last comment of the current user" means the last
# comment of `github-actions[bot]`, which is the author of every workflow's
# comments in the repository: a coverage report or a preview link posted after
# the checklist would be overwritten with it.

name: Operator checklist

on:
  pull_request:

# Deny everything at the workflow level; each job opts back into the single
# scope it needs. Without this line a job with no `permissions:` of its own
# inherits the repository default, which on many repositories is write.
permissions: {}

# One run per pull request. Superseded runs are cancelled so two of them cannot
# race to edit the same comment.
concurrency:
  group: ss-magic-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The pinned ss-magic-plugin. `ss-magic-plugin setup-github-ci` owns this
  # value and is the only thing that should change it - the binary, the skills
  # and the checklist format are released together, so a hand-bumped pin here
  # can name a version whose output this workflow does not expect.
  #
  # This is the PLUGIN's version, on its own release line
  # (`ss-magic-plugin-vX.Y.Z`), not the `ss-magic` sync CLI's. The two are
  # separate binaries released independently and their versions are never
  # equal, so a `v$SS_MAGIC_PLUGIN_VERSION` tag would name a different release
  # entirely - or none at all.
  SS_MAGIC_PLUGIN_VERSION: "@SS_MAGIC_PLUGIN_VERSION@"
  SS_MAGIC_REPO: ViktorStiskala/superset-magic

jobs:
  render:
    name: render the checklist
    runs-on: ubuntu-latest
    # A wedged run must fail rather than hold the pull request for GitHub's
    # 360-minute default.
    timeout-minutes: 10
    # Read-only. This is the job that runs pull-request code, so it holds
    # nothing that could write to the repository.
    permissions:
      contents: read
    outputs:
      # Whether this pull request adds or changes a checklist at all, so the
      # comment job knows there is something to post.
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge commit and its parents, so the selection below can diff
          # it against the target branch tip (its first parent). The default
          # depth of 1 would leave that parent out of the clone.
          fetch-depth: 2
          # Do not leave the job's token in .git/config, where a later step -
          # or a build script the checked-out code brings with it - could read
          # it back out.
          persist-credentials: false

      - name: Select the changed checklists
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          # The diff below is only right against a merge commit; anything else
          # fails here rather than selecting against the wrong parent.
          if ! git rev-parse --verify HEAD^2 >/dev/null; then
            echo '::error::HEAD is not the pull request merge commit.' >&2
            exit 1
          fi

          # Its own command writing to a file, never `< <(git diff ...)`: a
          # process substitution's failure is invisible to `set -e`, and a
          # failed diff would read as zero checklists. `--diff-filter=AMT` keeps
          # added, modified and type-changed (symlink to file, or the reverse)
          # documents and drops deleted ones; `--no-renames` lists a renamed
          # file as added at its new path; `:(glob)` stops `*` matching `/`, so
          # a nested file is never selected. Every name starts with
          # docs/actions/, so none can be read as an option.
          git diff --name-only -z --no-renames --diff-filter=AMT HEAD^1 HEAD \
            -- ':(glob)docs/actions/*.checklist.json' >"$RUNNER_TEMP/checklist-names"

          if [ -s "$RUNNER_TEMP/checklist-names" ]; then
            echo 'present=true' >>"$GITHUB_OUTPUT"
          else
            echo 'present=false' >>"$GITHUB_OUTPUT"
            echo 'This pull request adds or changes no docs/actions/*.checklist.json; nothing to render.'
          fi

      - name: Install the pinned ss-magic-plugin
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          archive="ss-magic-plugin-$target.tar.gz"
          base="https://github.com/$SS_MAGIC_REPO/releases/download/ss-magic-plugin-v$SS_MAGIC_PLUGIN_VERSION"

          # Everything lands outside the checkout, so a repository cannot ship a
          # file that the download or the extraction would overwrite.
          work=$(mktemp -d)
          cd "$work"

          # `-f` makes a 404 an error instead of a saved error page. A pin that
          # names an unpublished release therefore fails here, loudly, rather
          # than producing a broken binary further down.
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$archive.sha256" "$base/$archive.sha256"

          # The release publishes a `<archive>.sha256` sibling in sha256sum's
          # own format, so this is a plain `--check` rather than a hand-rolled
          # comparison. It fails closed: an empty, truncated or reformatted
          # checksum file makes `--check` error out, and the binary is never
          # installed.
          sha256sum --check "$archive.sha256"

          tar -xzf "$archive"
          # cargo-dist nests the binary one directory deep, named after the
          # archive.
          install -m 0755 "ss-magic-plugin-$target/ss-magic-plugin" \
            "$RUNNER_TEMP/ss-magic-plugin"
          cd - >/dev/null
          rm -rf "$work"

      - name: Verify the checklists
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every step is a fresh shell, so the names are read back from the
          # file here; an array from an earlier step would expand to nothing.
          names=()
          while IFS= read -r -d '' name; do
            names+=("$name")
          done <"$RUNNER_TEMP/checklist-names"
          # The selection found names, so none here means the file was lost.
          # With no arguments the verb would fall back to guessing a document.
          if [ ${#names[@]} -eq 0 ]; then
            echo '::error::The selected checklist names could not be read back.' >&2
            exit 1
          fi
          "$RUNNER_TEMP/ss-magic-plugin" checklist verify "${names[@]}"

      - name: Render the comment body
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          names=()
          while IFS= read -r -d '' name; do
            names+=("$name")
          done <"$RUNNER_TEMP/checklist-names"
          if [ ${#names[@]} -eq 0 ]; then
            echo '::error::The selected checklist names could not be read back.' >&2
            exit 1
          fi
          # GitHub refuses a comment over 65,536 characters; 60000 bytes keeps
          # the whole body, the note naming any omitted document included,
          # under it.
          "$RUNNER_TEMP/ss-magic-plugin" checklist render-md --max-bytes 60000 "${names[@]}" \
            >"$RUNNER_TEMP/checklist.md"

      - name: Upload the rendered body
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ss-magic-checklist-comment
          path: ${{ runner.temp }}/checklist.md
          # An empty upload here would surface in the next job as a confusing
          # "artifact not found"; fail where the cause is visible instead.
          if-no-files-found: error
          retention-days: 1

  comment:
    name: post the checklist comment
    needs: render
    # Two conditions, and the second is the fork case described in the header:
    # a fork pull request gets a read-only token, so posting would fail on every
    # one of them.
    if: >-
      needs.render.outputs.present == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job holding a write scope, and the only one that checks out
    # nothing. Both halves are the point; adding a checkout step here would
    # rejoin exactly what the split separates.
    permissions:
      pull-requests: write
    steps:
      - name: Download the rendered body
        uses: actions/download-artifact@v8
        with:
          name: ss-magic-checklist-comment
          path: ${{ runner.temp }}/comment

      - name: Post or update the comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` has no checkout to infer the repository from, so it is named
          # explicitly. Both of these are values GitHub supplies, not repository
          # content.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The first line of every comment this workflow posts. It renders as
          # nothing, and it is how a later run recognises the comment as its
          # own. A fixed string, never derived from the pull request.
          marker='<!-- ss-magic-plugin:operator-checklist -->'

          # The marker and a blank line add under 50 bytes to a body the render
          # job already bounded to 60000, so the comment stays below GitHub's
          # 65,536-character limit. The rendered Markdown is copied file to
          # file and later read from the file by `gh` itself. It is never an
          # argument, so no amount of quoting, backticks or `$(...)` in a
          # checklist can reach this shell. Both files this step makes go in a
          # directory of their own, apart from the downloaded artifact.
          work=$(mktemp -d)
          body="$work/body.md"
          {
            printf '%s\n\n' "$marker"
            cat "$RUNNER_TEMP/comment/checklist.md"
          } >"$body"

          # Every comment on the pull request, all pages of it: `gh` prints
          # each page as its own JSON array. Its own command writing to a file,
          # so a failed listing fails the job here; read as "no comment yet",
          # it would add a duplicate on every push instead.
          existing="$work/existing.json"
          gh api --paginate \
            "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" >"$existing"

          # The comment to rewrite is the newest one that is BOTH written by
          # `github-actions[bot]` AND starts with the marker. `gh pr comment
          # --edit-last` would pick the last comment of the current user, and
          # in Actions that user is `github-actions[bot]` for every workflow in
          # the repository, so it could overwrite a comment another workflow
          # posted. The marker alone is not enough either: anybody who can
          # comment can paste it, and this job must not rewrite their comment.
          # Ids are handed out in creation order, so the highest is the newest.
          # Comment bodies are other people's text; `jq` reads them from the
          # file as data and the marker arrives as `--arg`, so nothing from
          # them is ever part of a command or of the jq program. (`jq`, like
          # `gh`, is preinstalled on GitHub-hosted runners.)
          comment_id=$(jq -n -r --arg marker "$marker" '
            [ inputs[]
              | select(.user.login == "github-actions[bot]")
              | select((.body // "") | startswith($marker))
              | .id ]
            | max // empty
          ' "$existing")

          # The id goes into a request path, so it has to be a number and
          # nothing else.
          case "$comment_id" in
            *[!0-9]*)
              echo '::error::The existing comment id is not a number.' >&2
              exit 1
              ;;
          esac

          # One comment per pull request: the first push creates it and every
          # later push rewrites that same comment rather than appending
          # another. A pull request that already carries a comment from the
          # workflow ss-magic-plugin 1.0.1 and earlier wrote has no marker on
          # it, so it gets one new marked comment here and the unmarked one is
          # left as it is; that happens once and is accepted.
          if [ -n "$comment_id" ]; then
            gh api --silent --method PATCH \
              "repos/$GH_REPO/issues/comments/$comment_id" \
              -F "body=@$body"
          else
            gh pr comment "$PR_NUMBER" --body-file "$body"
          fi
