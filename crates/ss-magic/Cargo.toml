[package]
name = "ss-magic"
version = "0.12.0"
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "ss-magic"
path = "src/main.rs"

[dependencies]
ss-magic-core = { path = "../ss-magic-core" }
anyhow = "1"
bzip2 = "0.6"
directories = { version = "6.0.0", default-features = false }
fd-lock = "4.0.4"
globset = "0.4"
inquire = "0.9"
ratatui = "0.30.2"
# YAML 1.2 parser with source spans, used ONLY to locate and re-check the two
# managed keys of `orca.yaml` (the file itself is edited as text, so comments
# survive). A CLI-only dependency: the plugin binary links core, not this crate,
# and must never gain a YAML parser.
# Default features off: the only one is `encoding` (decoding non-UTF-8 input
# through `encoding_rs`), and `orca.yaml` is read as UTF-8 text or refused.
saphyr = { version = "0.2", default-features = false }
self_update = { version = "0.44.0", default-features = false, features = ["ureq", "rustls", "archive-tar", "compression-flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.1.1", features = ["inline"] }
tar = "0.4"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
# The shared test helpers (`ss_magic_core::testutil`): git fixtures and the
# run-one-test-in-a-child-process seam. A dev-dependency so the feature never
# reaches a release build.
ss-magic-core = { path = "../ss-magic-core", features = ["testutil"] }
