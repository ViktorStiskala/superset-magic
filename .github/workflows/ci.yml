# Test suite CI, plus the plugin packaging assertions.
#
# Runs on every PR commit and on pushes to main. Also callable as a reusable
# workflow: dist-workspace.toml registers it via `local-artifacts-jobs =
# ["./ci"]`, so the cargo-dist release workflow (release.yml) invokes it as a
# `custom-ci` job, alongside the artifact builds, and the host job (the one that
# creates the GitHub Release) publishes only if this workflow succeeded.
#
# It used to be a plan job (`plan-jobs`), which gated the BUILDS but not the
# publish. A failure there skipped the builds, host read "skipped" as fine, and
# on 2026-09-30 it published v0.11.1 and ss-magic-plugin-v1.0.0 with no assets.
# Both releases are immutable and their tags protected, so both versions were
# lost. `scripts/build-plugin-zip.py --check` now asserts the gate's shape in
# release.yml.
#
# The `plugin` job guards the marketplace delivery path: the plugin zip's SHA-256
# is committed into .claude-plugin/marketplace.json before the tag exists, and a
# pin that does not match the tree it names installs nothing (or, worse, installs
# unpinned). When this workflow runs as the release gate, a failed assertion
# means nothing is published, although the builds may already have run.
#
# The GITHUB_TOKEN stays read-only even when called from release.yml (which
# grants contents: write): cargo test executes third-party build scripts, so
# the write-capable token must not be reachable from this job.
name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  # cargo-dist passes local-artifacts jobs the plan manifest as `plan`. The
  # input must be declared (GitHub rejects an undeclared one: "Invalid input,
  # plan is not defined in the referenced workflow"), but nothing here reads it,
  # and it stays optional so the workflow can still be called without it.
  workflow_call:
    inputs:
      plan:
        type: string
        required: false

# Cancel superseded runs on the same PR. Guarded so tag-triggered release
# invocations (unique refs) never cancel each other. Workflow-level
# concurrency is evaluated in the caller's context under workflow_call.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # This job gates releases (release.yml custom-ci); a wedged run must fail
    # fast instead of stalling PRs and tags for GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --workspace --locked

      # The bootstrap and the wrapper are shell, and macOS ships bash 3.2 - no
      # associative arrays, no `${var^^}`, no `mapfile`. The plugin job below
      # runs the same harness on Linux; this is the only place that proves the
      # scripts work on the older shell half the users have. Uses a fake curl
      # on PATH, so it never touches the network.
      - name: Plugin bootstrap failure-path tests (bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-bootstrap.sh

      # The latest-mark script is bash 3.2 too (a `case` arm cannot sit inside
      # `$( … )` there, and `read` must handle an unterminated last line); the
      # plugin job runs its suite under Linux's bash 5, which would let a bash-4
      # construct pass unnoticed. This leg is the proof for the older shell.
      - name: Latest-mark selection tests (bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-mark-latest.sh

      # The documentation guards are bash 3.2 and BSD grep/awk/find too; the
      # plugin job runs them under Linux's bash 5 and GNU tools, which would let
      # a bash-4 or GNU-only construct pass unnoticed.
      - name: Documentation guards (bash 3.2)
        if: runner.os == 'macOS'
        run: |
          /bin/bash scripts/check-docs.sh --selftest
          /bin/bash scripts/check-docs.sh

  plugin:
    name: plugin package
    runs-on: ubuntu-latest
    # Same reasoning as the test job: this gates releases, so a wedged run must
    # fail fast rather than stall a tag for GitHub's 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The R98 check compares the plugin tree against the previous release
          # tag, so the tags and the history reaching them must both be present.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The workspace publishes two release lines from one repository, and
      # cargo-dist parses a tag as `[PACKAGE_NAME-]VERSION`:
      #
      #   vX.Y.Z                  -> every dist-able package at that version,
      #                              which is the CLI alone only because the two
      #                              crate versions always differ (--check
      #                              enforces that they do)
      #   ss-magic-plugin-vX.Y.Z  -> the plugin
      #
      # Any other shape is a silent, permanent mistake rather than a failed
      # release. A prefixed CLI tag like `ss-magic-v0.11.1` builds and publishes
      # perfectly well, but the updater's anchored filter only recognises bare
      # `vX.Y.Z`, so every already-installed binary ignores that release forever
      # -- the line is stranded with no error anywhere. On a release this job is
      # part of the gate the host job waits for, so failing here stops the
      # release from being published (the builds run alongside it, but nothing
      # they produce is uploaded).
      - name: Release tag shape
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "not a tag build (ref type '${GITHUB_REF_TYPE:-none}'); nothing to check."
            exit 0
          fi
          if printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^(v|ss-magic-plugin-v)[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ok: '$GITHUB_REF_NAME' names a known release line."
            exit 0
          fi
          echo "tag '$GITHUB_REF_NAME' matches neither release line." >&2
          echo "  vX.Y.Z                 releases ss-magic (the CLI)" >&2
          echo "  ss-magic-plugin-vX.Y.Z releases ss-magic-plugin" >&2
          echo "A CLI tag must NOT be prefixed: the updater's anchored filter and" >&2
          echo "every installed binary look for a bare vX.Y.Z, so a prefixed tag" >&2
          echo "would publish a release the whole installed base ignores." >&2
          exit 1

      # The builder is the one artifact both a human and CI run. If they can
      # ever disagree the pin is meaningless, so its own reproducibility and
      # refusal tests run here rather than being trusted.
      - name: Builder selftest (AE79 reproducibility, AE80 refusals)
        run: python3 scripts/build-plugin-zip.py --selftest

      # Several assertions, and none is implied by the others: a misspelled or
      # absent `sha256` key makes the marketplace entry validate cleanly and
      # install the plugin unpinned; equal versions on the two release lines make
      # one bare CLI tag publish a plugin release too; a hook entry naming the
      # binary ENOENTs a first session. `--check` prints one ok/FAIL line each.
      - name: Release assertions (R95 versions, R96 digest pin, R101 sha256 key)
        run: python3 scripts/build-plugin-zip.py --check

      # The plugin's inability to self-update or open a TUI is meant to be
      # structural (R2), and a `cargo build` can only show that a dependency is
      # PRESENT -- nothing in a successful build says one is ABSENT. `cargo tree
      # -p ss-magic-plugin -i <crate>` scopes the resolve to the plugin's own
      # subgraph and inverts around the crate, so it also catches the crate
      # arriving transitively through ss-magic-core.
      #
      # Exit codes run backwards here: a MATCH exits 0 (and must fail the job),
      # while "no such package in this subgraph" exits non-zero (and must pass
      # it). The message is matched explicitly so an unrelated cargo failure --
      # a missing lockfile, a resolve error -- is reported rather than read as
      # proof of absence.
      - name: The plugin links no updater and no TUI (R2)
        run: |
          set -euo pipefail
          for crate in self_update inquire ratatui; do
            if out=$(cargo tree --locked -p ss-magic-plugin -i "$crate" 2>&1); then
              printf '%s\n' "$out"
              echo "ss-magic-plugin links $crate; it must link neither an updater nor a TUI." >&2
              exit 1
            fi
            case "$out" in
              *"did not match any packages"*)
                echo "ok: ss-magic-plugin does not link $crate" ;;
              *)
                printf '%s\n' "$out"
                echo "cargo tree failed for an unrelated reason; absence is not proven." >&2
                exit 1 ;;
            esac
          done

      # R98: the resolved version, not the digest, is the update signal.
      # `claude plugin update` skips a plugin whose version already matches, so
      # new bytes under an unchanged version reach nobody and nothing errors.
      - name: Content change requires a version bump (R98)
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse 'HEAD^{commit}')
          base=""
          # Both release lines are valid baselines: the plugin tree can change on
          # either one's commit, so the most recent release of EITHER shape is the
          # last point the tree is known to have been published from. Sorted by
          # -creatordate rather than -v:refname because the two shapes do not sort
          # against each other as versions at all -- every `ss-magic-plugin-v*`
          # tag would sort ahead of every `v*` one regardless of when it was made.
          for tag in $(git tag --list --sort=-creatordate --merged HEAD); do
            # Anchored, like every other tag filter in the repository: a shell
            # glob such as `v[0-9]*.[0-9]*.[0-9]*` also matches `v1.2.3-rc1` or
            # `v1.2.3.4`, and a tag of that shape was never a published
            # release, so it must not become the baseline the bump check
            # compares against.
            printf '%s\n' "$tag" |
              grep -Eq '^(v|ss-magic-plugin-v)[0-9]+\.[0-9]+\.[0-9]+$' || continue
            # On a tag build HEAD *is* the release tag; compare against the
            # previous one, not against itself.
            if [ "$(git rev-parse "$tag^{commit}")" != "$head_commit" ]; then
              base="$tag"
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "no earlier release tag is reachable from HEAD; nothing to compare against."
            exit 0
          fi
          echo "baseline: $base"
          python3 scripts/build-plugin-zip.py --check-bump "$base"

      # The documentation guards, one ok/FAIL line each: the retired
      # `ss-magic` + `plugin` subcommand spelling (over the current-state docs,
      # .claude/rules/ included), no CLAUDE_PLUGIN_DATA in a skill body, no
      # releases/latest/download/ URL in README, BUGBOT link-free and naming no
      # individual rule file, every relative link resolving, rule-file
      # frontmatter absent or a well-formed `paths:` list, and the always-loaded
      # set (CLAUDE.md plus every rule file without `paths:`) within 50,000
      # bytes. The reasoning for each lives in the script, which also runs
      # locally; docs/plans/ is out of every guard's scope. Running here puts
      # them in the release gate.
      - name: Documentation guards (scripts/check-docs.sh)
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh --selftest
          bash scripts/check-docs.sh

      # After a plugin release, the post-announce job hands the repository-wide
      # "latest" mark back to the newest CLI release (R12) – every ss-magic
      # binary released before the per-line update check polls releases/latest
      # and parses only a bare vX.Y.Z. The selection runs in a shell script
      # against a fake `gh`, over the same tag list the Rust filter is tested
      # with: drafts and prereleases dropped, anchored `v` + triple, numeric
      # order, and the plugin tag never chosen.
      - name: Latest-mark selection (scripts/mark-latest.sh)
        run: bash scripts/test-mark-latest.sh

      # The bootstrap runs at every fresh session on every machine with the
      # plugin enabled, so its failure paths matter more than its success path:
      # offline, a corrupted download, a hostile version pin, an unwritable data
      # directory, an unsupported platform, and four sessions racing to install
      # at once. Each asserts exit 0, empty stdout (a hook's stdout enters the
      # model's context) and an untouched existing binary. A curl shim on PATH
      # serves a locally built fake release, so no network is involved.
      - name: Plugin bootstrap failure-path tests (AE57-AE67)
        run: bash scripts/test-bootstrap.sh

      # Run the exact command cargo-dist registers as the extra artifact's build,
      # and confirm it produces the filename `artifacts` declares. A mismatch
      # there publishes no plugin asset at all, and the marketplace url would then
      # 404 for every user.
      #
      # The declaration lives on the plugin crate now
      # ([[package.metadata.dist.extra-artifacts]]), so the zip rides the plugin's
      # tag rather than the CLI's. dist-workspace.toml is still read as a fallback
      # so a tree that has not moved the entry yet is checked rather than silently
      # unchecked -- the same order scripts/build-plugin-zip.py uses.
      - name: Build the asset cargo-dist will publish
        run: |
          set -euo pipefail
          pattern='ss-magic-plugin-v[0-9]+\.[0-9]+\.[0-9]+\.zip'
          artifact=$(grep -oE "$pattern" crates/ss-magic-plugin/Cargo.toml | head -1 || true)
          if [ -z "$artifact" ]; then
            artifact=$(grep -oE "$pattern" dist-workspace.toml | head -1 || true)
          fi
          if [ -z "$artifact" ]; then
            echo "no [[package.metadata.dist.extra-artifacts]] entry names a" >&2
            echo "ss-magic-plugin-vX.Y.Z.zip, in the plugin crate manifest or in" >&2
            echo "dist-workspace.toml; the plugin zip would not be published." >&2
            exit 1
          fi
          python3 scripts/build-plugin-zip.py
          if [ ! -f "$artifact" ]; then
            echo "builder produced no $artifact; dist would publish nothing and the" >&2
            echo "marketplace url would 404 for every user. The builder derives its" >&2
            echo "filename from crates/ss-magic-plugin/Cargo.toml's version, so this" >&2
            echo "means the declared artifact name and that manifest disagree." >&2
            exit 1
          fi
          python3 - "$artifact" <<'PY'
          import hashlib, json, pathlib, sys, zipfile

          path = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(path) as zf:
              stored = [i.filename for i in zf.infolist() if i.compress_type != zipfile.ZIP_STORED]
              assert not stored, f"deflated entries in the archive: {stored}"
              assert any(
                  n == ".claude-plugin/plugin.json" for n in zf.namelist()
              ), "the manifest is not at the zip root; the loader would not find it"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          pinned = manifest["plugins"][0]["source"]["sha256"].lower()
          assert digest == pinned, f"built {digest} but the manifest pins {pinned}"
          print(f"{path.name}: {digest} (matches the committed pin)")
          PY
